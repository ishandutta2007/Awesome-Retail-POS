<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic CSS Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.05); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(180px); opacity: 0.2; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .pulse-circle {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .floating-card {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-badge {
        animation: floatFast 4s ease-in-out infinite;
      }
      .scanner-beam {
        animation: scanline 3s ease-in-out infinite alternate;
      }
      .animated-dash {
        stroke-dasharray: 8 6;
        animation: dashMove 2s linear infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .sub-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="356" x="2" y="2" rx="14" fill="none" stroke="#374151" stroke-width="1.5" opacity="0.6" />

  <!-- Animated Neon Ambient Orbs -->
  <circle cx="180" cy="180" r="140" fill="#38bdf8" opacity="0.15" filter="url(#glow)" class="pulse-circle" />
  <circle cx="1000" cy="140" r="160" fill="#818cf8" opacity="0.18" filter="url(#glow)" class="pulse-circle" style="animation-delay: -3s;" />
  <circle cx="550" cy="220" r="100" fill="#10b981" opacity="0.08" filter="url(#glow)" class="pulse-circle" style="animation-delay: -1.5s;" />

  <!-- Background Grid Pattern -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Left Side: Illustrative POS Terminal & Commerce Matrix -->
  <g transform="translate(90, 50)" class="floating-card">
    <!-- Main POS Terminal Graphic -->
    <g>
      <!-- Base Stand -->
      <path d="M 120 220 L 200 220 L 220 260 L 100 260 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      
      <!-- Terminal Screen Frame -->
      <rect x="50" y="30" width="220" height="170" rx="12" fill="#0f172a" stroke="#64748b" stroke-width="2" />
      <!-- Screen Display -->
      <rect x="62" y="42" width="196" height="146" rx="8" fill="#020617" />
      
      <!-- Screen Content Header -->
      <rect x="72" y="52" width="176" height="20" rx="4" fill="#1e293b" />
      <circle cx="82" cy="62" r="3" fill="#ef4444" />
      <circle cx="92" cy="62" r="3" fill="#f59e0b" />
      <circle cx="102" cy="62" r="3" fill="#10b981" />
      <text x="160" y="66" fill="#94a3b8" font-size="9" text-anchor="middle" font-weight="700" class="title-text">RETAIL CHECKOUT</text>

      <!-- Cart Items Simulation -->
      <rect x="72" y="80" width="110" height="8" rx="2" fill="#334155" />
      <rect x="195" y="80" width="53" height="8" rx="2" fill="#38bdf8" opacity="0.8" />
      
      <rect x="72" y="96" width="95" height="8" rx="2" fill="#334155" />
      <rect x="195" y="96" width="53" height="8" rx="2" fill="#38bdf8" opacity="0.8" />

      <rect x="72" y="112" width="125" height="8" rx="2" fill="#334155" />
      <rect x="195" y="112" width="53" height="8" rx="2" fill="#38bdf8" opacity="0.8" />

      <!-- Divider & Total -->
      <line x1="72" y1="130" x2="248" y2="130" stroke="#334155" stroke-width="1" />
      <text x="72" y="148" fill="#e2e8f0" font-size="11" font-weight="700" class="title-text">TOTAL: $148.50</text>

      <!-- Checkout Button Glow -->
      <rect x="72" y="158" width="176" height="20" rx="5" fill="url(#accentGrad)" />
      <text x="160" y="172" fill="#042f2e" font-size="10" font-weight="800" text-anchor="middle" class="title-text">✓ PROCESS SALE</text>

      <!-- Scanning Laser Dynamic Line -->
      <line x1="62" y1="42" x2="258" y2="42" stroke="#f43f5e" stroke-width="2" filter="url(#glow)" class="scanner-beam" />
    </g>

    <!-- Floating Payment Card Badge -->
    <g transform="translate(180, 20)" class="floating-badge">
      <rect width="130" height="80" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" filter="url(#subtleGlow)" />
      <circle cx="25" cy="25" r="10" fill="#f59e0b" opacity="0.85" />
      <circle cx="38" cy="25" r="10" fill="#ef4444" opacity="0.85" />
      <rect x="15" y="48" width="60" height="6" rx="2" fill="#94a3b8" opacity="0.6" />
      <rect x="15" y="60" width="95" height="6" rx="2" fill="#64748b" opacity="0.4" />
      <text x="115" y="30" fill="#38bdf8" font-size="12" text-anchor="end">💳</text>
    </g>

    <!-- Floating Barcode & Cloud Connectivity Graphic -->
    <g transform="translate(-25, 150)">
      <rect width="80" height="40" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
      <!-- Barcode lines -->
      <line x1="12" y1="12" x2="12" y2="28" stroke="#10b981" stroke-width="2" />
      <line x1="18" y1="12" x2="18" y2="28" stroke="#10b981" stroke-width="3" />
      <line x1="24" y1="12" x2="24" y2="28" stroke="#10b981" stroke-width="1.5" />
      <line x1="30" y1="12" x2="30" y2="28" stroke="#10b981" stroke-width="2.5" />
      <line x1="36" y1="12" x2="36" y2="28" stroke="#10b981" stroke-width="1" />
      <line x1="42" y1="12" x2="42" y2="28" stroke="#10b981" stroke-width="3" />
      <line x1="50" y1="12" x2="50" y2="28" stroke="#10b981" stroke-width="2" />
      <line x1="58" y1="12" x2="58" y2="28" stroke="#10b981" stroke-width="1.5" />
      <line x1="66" y1="12" x2="66" y2="28" stroke="#10b981" stroke-width="2.5" />
    </g>
  </g>

  <!-- Right Side: Hero Title & Content (Right Aligned) -->
  <g>
    <!-- Category Pill -->
    <g transform="translate(910, 56)">
      <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8" filter="url(#subtleGlow)" />
      <text x="32" y="21" fill="#38bdf8" font-size="13" font-weight="700" class="title-text" letter-spacing="0.05em">CURATED DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="1120" y="145" text-anchor="end" fill="url(#primaryGrad)" font-size="54" class="title-text" filter="url(#subtleGlow)">Awesome Retail POS</text>

    <!-- Tagline & Description -->
    <text x="1120" y="185" text-anchor="end" fill="#f1f5f9" font-size="20" font-weight="600" class="sub-text">
      The Complete Guide to SaaS &amp; Open-Source Point of Sale Systems
    </text>

    <text x="1120" y="218" text-anchor="end" fill="#94a3b8" font-size="14" class="sub-text">
      💳 Checkout &amp; Payments  •  📦 Multi-Store Inventory  •  🌐 Omnichannel Retail  •  🚀 ERP Integrations
    </text>

    <!-- Features / Badges Row -->
    <g transform="translate(626, 260)">
      <!-- SaaS Tag -->
      <g>
        <rect width="140" height="36" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
        <text x="70" y="22" fill="#c7d2fe" font-size="13" font-weight="600" text-anchor="middle" class="sub-text">⚡ SaaS Platforms</text>
      </g>
      <!-- Open Source Tag -->
      <g transform="translate(152, 0)">
        <rect width="165" height="36" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
        <text x="82" y="22" fill="#6ee7b7" font-size="13" font-weight="600" text-anchor="middle" class="sub-text">🔓 Open-Source POS</text>
      </g>
      <!-- Pricing Verified Tag -->
      <g transform="translate(329, 0)">
        <rect width="165" height="36" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
        <text x="82" y="22" fill="#fcd34d" font-size="13" font-weight="600" text-anchor="middle" class="sub-text">🏷️ Verified Pricing</text>
      </g>
    </g>
  </g>
</svg>
